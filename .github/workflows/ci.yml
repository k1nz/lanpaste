name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The two catalogues must carry the same keys; the app's own tests assert
      # this too, but the script fails with a readable diff.
      - run: npm run i18n:parity

  site:
    name: Marketing site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build
        working-directory: site
        env:
          VITE_BASE: /lanpaste/
        run: |
          npm ci
          npm run build

  rust:
    name: Rust
    # The clipboard layer and the golden path are macOS and Windows only, so
    # test on the platform the app actually ships for.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: cargo test
        working-directory: src-tauri
