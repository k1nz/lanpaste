name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches package versions
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          tauri="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          cargo="$(awk -F '"' '/^\[package\]/{p=1} p && /^version = /{print $2; exit}' src-tauri/Cargo.toml)"
          echo "tag=$tag package.json=$pkg tauri.conf.json=$tauri Cargo.toml=$cargo"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$tauri" ] || [ "$tag" != "$cargo" ]; then
            echo "Tag $GITHUB_REF_NAME must match package.json, src-tauri/tauri.conf.json, and src-tauri/Cargo.toml"
            exit 1
          fi

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git-cliff --current --strip all -o RELEASE_NOTES.md

      - name: Create GitHub Release
        id: create-release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          script: |
            const fs = require('fs');
            const tag = process.env.RELEASE_TAG;
            const prerelease = tag.includes('-');
            let body = '';
            if (fs.existsSync('RELEASE_NOTES.md')) {
              body = fs.readFileSync('RELEASE_NOTES.md', 'utf8').trim();
            }
            if (!body) {
              body = 'See the assets to download this version and install.';
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            if (release) {
              const { data } = await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: release.data.id,
                name: `LanPaste ${tag}`,
                body,
                draft: true,
                prerelease,
              });
              return data.id;
            }

            const { data } = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              name: `LanPaste ${tag}`,
              body,
              draft: true,
              prerelease,
            });
            return data.id;

      - name: Update CHANGELOG.md on default branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$DEFAULT_BRANCH"
          git checkout -B "changelog-${GITHUB_REF_NAME}" "origin/${DEFAULT_BRANCH}"
          git-cliff -o CHANGELOG.md
          git add CHANGELOG.md
          if git diff --staged --quiet; then
            echo "CHANGELOG.md unchanged"
            exit 0
          fi
          git commit -m "chore(release): update CHANGELOG for ${GITHUB_REF_NAME}"
          git push origin "HEAD:${DEFAULT_BRANCH}"

  build:
    name: Build ${{ matrix.name }}
    needs: changelog
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-latest
            args: --target x86_64-apple-darwin
          - name: Windows
            platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.changelog.outputs.release_id }}
          args: ${{ matrix.args }}

  publish:
    name: Publish release
    needs: [changelog, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish GitHub Release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.changelog.outputs.release_id }}
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.RELEASE_ID,
              draft: false,
              prerelease: process.env.RELEASE_TAG.includes('-'),
            });
